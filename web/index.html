<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Fcitx5 Dynamic Themes Studio</title>
    <link rel="stylesheet" href="styles.css?v=fcitx-layout-v6" />
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="app.js?v=fcitx-layout-v10" defer></script>
  </head>
  <body>
    <header class="top-app-bar">
      <a class="brand" href="https://github.com/DotRedstone/fcitx5-dynamic-themes"><span class="brand-symbol"><i data-lucide="palette"></i></span><span>Fcitx5 Dynamic Themes</span></a>
      <div class="top-actions">
        <div class="language-switch" role="group" aria-label="Language"><button type="button" data-language="en">EN</button><button type="button" data-language="zh">中文</button></div>
        <button id="reset" class="icon-button" type="button" title="Reset" aria-label="Reset"><i data-lucide="rotate-ccw"></i></button>
        <label id="import-label" class="icon-button" title="Import theme JSON" aria-label="Import theme JSON"><i data-lucide="folder-open"></i><input id="import" type="file" accept="application/json" /></label>
        <a id="repository-link" class="icon-button" href="https://github.com/DotRedstone/fcitx5-dynamic-themes" title="Open GitHub repository" aria-label="Open GitHub repository"><i data-lucide="code-xml"></i></a>
      </div>
    </header>

    <main class="studio-layout">
      <aside class="settings-panel surface-panel" aria-label="Theme settings">
        <div class="panel-title"><span data-i18n="theme">Theme</span></div>
        <label class="field-label" for="theme-name" data-i18n="themeName">Theme name</label>
        <input id="theme-name" class="text-input" type="text" maxlength="64" spellcheck="false" />
        <button id="reset-theme" class="outlined-button" type="button"><i data-lucide="rotate-ccw"></i><span data-i18n="restoreDefaults">Restore theme defaults</span></button>
        <section class="control-section">
          <h2 data-i18n="styleThemes">Style</h2>
          <div id="style-grid" class="preset-grid" role="list"></div>
          <h2 class="preset-subtitle" data-i18n="colorThemes">Color</h2>
          <div id="color-theme-grid" class="color-theme-grid" role="list"></div>
        </section>
        <section class="control-section">
          <h2 data-i18n="appearance">Appearance</h2>
          <span class="field-label" data-i18n="colorMode">Color mode</span>
          <div class="segmented" role="group" aria-label="Color mode"><button type="button" data-mode="light" data-i18n="light">Light</button><button type="button" data-mode="dark" data-i18n="dark">Dark</button></div>
        </section>
        <section id="rounded-controls" class="control-section">
          <h2 data-i18n="geometry">Geometry</h2>
          <label class="range-label" for="panel-radius"><span data-i18n="panelRadius">Panel radius</span><output id="panel-radius-value"></output></label><input id="panel-radius" type="range" min="0" max="26" step="1" />
          <label class="range-label" for="highlight-radius"><span data-i18n="highlightRadius">Highlight radius</span><output id="highlight-radius-value"></output></label><input id="highlight-radius" type="range" min="0" max="25" step="1" />
          <label class="range-label" for="outline-width"><span data-i18n="outlineWidth">Outline width</span><output id="outline-width-value"></output></label><input id="outline-width" type="range" min="0" max="6" step="0.05" />
          <label class="range-label" for="content-padding"><span data-i18n="contentPadding">Candidate inset</span><output id="content-padding-value"></output></label><input id="content-padding" type="range" min="0" max="48" step="1" />
          <label class="range-label" for="text-margin-horizontal"><span data-i18n="textMarginHorizontal">Text margin, horizontal</span><output id="text-margin-horizontal-value"></output></label><input id="text-margin-horizontal" type="range" min="0" max="24" step="1" />
          <label class="range-label" for="text-margin-vertical"><span data-i18n="textMarginVertical">Text margin, vertical</span><output id="text-margin-vertical-value"></output></label><input id="text-margin-vertical" type="range" min="0" max="24" step="1" />
          <div class="advanced-controls">
            <div class="advanced-grid">
              <label class="range-label" for="panel-opacity"><span data-i18n="panelInset">Panel inset</span><output id="panel-opacity-value"></output></label><input id="panel-opacity" type="range" min="0" max="1" step="0.02" />
              <label class="range-label" for="highlight-opacity"><span data-i18n="highlightInset">Highlight inset</span><output id="highlight-opacity-value"></output></label><input id="highlight-opacity" type="range" min="0" max="1" step="0.02" />
              <label class="range-label" for="panel-slice-margin"><span data-i18n="panelSliceMargin">Panel image slice</span><output id="panel-slice-margin-value"></output></label><input id="panel-slice-margin" type="range" min="4" max="15" step="1" />
              <label class="range-label" for="highlight-slice-margin-horizontal"><span data-i18n="highlightSliceMarginHorizontal">Highlight image slice, horizontal</span><output id="highlight-slice-margin-horizontal-value"></output></label><input id="highlight-slice-margin-horizontal" type="range" min="4" max="15" step="1" />
              <label class="range-label" for="highlight-slice-margin-vertical"><span data-i18n="highlightSliceMarginVertical">Highlight image slice, vertical</span><output id="highlight-slice-margin-vertical-value"></output></label><input id="highlight-slice-margin-vertical" type="range" min="4" max="15" step="1" />
              <label class="range-label" for="candidate-comment-scale"><span data-i18n="candidateCommentScale">Candidate comment scale</span><output id="candidate-comment-scale-value"></output></label><input id="candidate-comment-scale" type="range" min="0.5" max="1.5" step="0.05" />
              <label class="range-label" for="text-margin-bottom"><span data-i18n="textMarginBottom">Text margin, bottom</span><output id="text-margin-bottom-value"></output></label><input id="text-margin-bottom" type="range" min="0" max="24" step="1" />
              <label class="toggle-row" for="full-width-highlight"><span data-i18n="fullWidthHighlight">Fill row when vertical</span><input id="full-width-highlight" type="checkbox" /></label>
            </div>
          </div>
        </section>
        <section class="control-section"><div class="section-line"><h2 data-i18n="palette">Palette</h2><span id="palette-mode" class="state-label"></span></div><div id="color-controls" class="color-controls"></div></section>
      </aside>

      <section class="preview-panel" aria-label="Fcitx5 live preview">
        <div class="preview-heading"><div><span class="overline" data-i18n="livePreview">Live preview</span><h1 data-i18n="candidateWindow">Candidate window</h1></div><span id="preview-status" class="status-chip"></span></div>
        <div class="preview-controls surface-panel">
          <div class="preview-control-title"><span data-i18n="preview">Preview</span><span class="preview-only" data-i18n="previewOnly">Preview only</span></div>
          <div class="preview-control-grid">
            <div><span class="field-label" data-i18n="candidateLayout">Candidate layout</span><div class="segmented" role="group" aria-label="Candidate layout"><button type="button" data-preview-layout="horizontal" data-i18n="horizontal">Horizontal</button><button type="button" data-preview-layout="vertical" data-i18n="vertical">Vertical</button></div></div>
            <div><span class="field-label" data-i18n="candidateCount">Candidate count</span><div class="stepper" role="group" aria-label="Candidate count"><button id="candidate-less" class="icon-button compact" type="button" title="Fewer candidates" aria-label="Fewer candidates"><i data-lucide="minus"></i></button><output id="candidate-count" aria-live="polite"></output><button id="candidate-more" class="icon-button compact" type="button" title="More candidates" aria-label="More candidates"><i data-lucide="plus"></i></button></div></div>
          </div>
        </div>
        <div class="preview-stage">
          <div id="candidate-panel" class="candidate-panel"><div class="candidate-frame"><div id="candidates" class="candidates"></div></div></div>
        </div>
      </section>

      <aside class="export-panel surface-panel" aria-label="Theme export">
        <section class="quick-install">
          <div class="panel-title"><span data-i18n="quickInstall">Quick install</span></div>
          <code id="install-command" class="install-command"></code>
          <button id="copy-command" class="filled-button" type="button" title="Copy install command" aria-label="Copy install command"><i data-lucide="terminal"></i><span data-i18n="copyInstallCommand">Copy install command</span></button>
        </section>
        <details class="json-backup">
          <summary data-i18n="themeJsonBackup">Theme JSON backup</summary>
          <div class="panel-title"><span data-i18n="themeJson">Theme JSON</span><button id="copy-config" class="icon-button compact" type="button" title="Copy JSON" aria-label="Copy JSON"><i data-lucide="copy"></i></button></div>
          <pre id="json-output" class="json-output"></pre>
          <button id="download" class="outlined-button" type="button"><i data-lucide="download"></i><span data-i18n="downloadJson">Download JSON</span></button>
        </details>
      </aside>
    </main>
  </body>
</html>
